<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קריוקי ותמלול מילה-במילה עם זיכרון</title>
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --accent: #ff2a6d;
      --text: #e0e6ed;
      --text-dim: #71788e;
      --highlight: #ffe600;
      --sung-word: #05d9e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .controls-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: #0f111a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      direction: ltr;
    }
    textarea {
      width: 100%;
      height: 65px;
      background: #0f111a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      direction: ltr;
      resize: vertical;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }

    /* History Library */
    .history-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #b2b8c6;
    }
    .history-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 10px;
      border-radius: 16px;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s;
      font-family: monospace;
      direction: ltr;
    }
    .history-chip:hover {
      background: var(--accent);
    }

    #status-msg {
      font-size: 0.85rem;
      color: #a5abb8;
    }

    .video-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      background: #000;
    }
    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .lyrics-container {
      position: relative;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 16px;
      height: 340px;
      overflow-y: auto;
      scroll-behavior: smooth;
      direction: ltr;
      border: 1px solid rgba(255,255,255,0.07);
    }
    #bouncing-ball {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      pointer-events: none;
      transition: left 0.1s ease-out, top 0.1s ease-out;
      transform: translate(-50%, -100%);
      display: none;
      z-index: 10;
      animation: bounce 0.4s infinite alternate ease-in-out;
    }
    @keyframes bounce {
      0% { transform: translate(-50%, -120%); }
      100% { transform: translate(-50%, -180%); }
    }
    .caption-line {
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      font-size: 1.2rem;
      line-height: 1.7;
      transition: background 0.25s;
    }
    .caption-line.active-line {
      background: rgba(255, 42, 109, 0.12);
      border-left: 3px solid var(--accent);
    }
    .word {
      display: inline-block;
      position: relative;
      color: var(--text-dim);
      transition: color 0.15s, transform 0.15s;
    }
    .word.passed { color: var(--sung-word); }
    .word.active {
      color: var(--highlight);
      font-weight: 800;
      transform: scale(1.18);
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="controls-panel">
      <div class="input-group">
        <input type="text" id="ytUrlInput" placeholder="הדביקי קישור יוטיוב..." value="https://youtu.be/mFA1P8ZzoLw">
        <button onclick="handleLoadVideo()">טען סרטון</button>
      </div>

      <textarea id="manualTranscriptInput" placeholder="הדביקי כאן תמליל/כתוביות עם זמנים..."></textarea>
      
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="status-msg">מוכן...</span>
        <button onclick="parseAndSaveTranscript()">שמור וסנכרן תמליל</button>
      </div>

      <!-- History of saved videos -->
      <div class="history-box" id="historyBox">
        <span>סרטונים שמורים בזיכרון:</span>
        <div id="historyChips" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
      </div>
    </div>

    <div class="video-box">
      <div id="player"></div>
    </div>

    <div class="lyrics-container" id="lyricsBox">
      <div id="bouncing-ball"></div>
    </div>
  </div>

  <script>
    let player;
    let allWords = [];
    let loopId = null;
    let activeWordIndex = -1;
    let currentVideoId = 'mFA1P8ZzoLw';

    const box = document.getElementById('lyricsBox');
    const statusMsg = document.getElementById('status-msg');
    const historyChips = document.getElementById('historyChips');

    // Default song fallback (Troye Sivan)
    const troyeSubs = [
      { start: 5.0, dur: 3.5, text: "SHE’S WALKING DOWN THE STREET WITH HER LITTLE THIN CIGARETTE" },
      { start: 9.3, dur: 4.5, text: "GREAT SMILE, AND A CUM STAIN ON HER DRESS" },
      { start: 17.0, dur: 3.0, text: "DJS FROM WEDNESDAY TO MONDAY" },
      { start: 21.0, dur: 4.0, text: "DON’T ASK, SHE’S NOT TAKING ANY FUCKING REQUESTS" },
      { start: 29.0, dur: 4.5, text: "QUICK DRAG, A ROUGE CHEEK, A BLUSH LIP" },
      { start: 33.8, dur: 5.5, text: "EYELINER IN HER WATERLINE AND SOME CONTOUR ON HER TITS" },
      { start: 41.0, dur: 3.5, text: "NIGHT OWL AND SOMEHOW AN EARLY BIRD" },
      { start: 44.8, dur: 4.0, text: "SHE KIND OF JUST STAYS PERPETUALLY TIRED" },
      { start: 54.0, dur: 5.0, text: "THAT GIRL, THAT GIRL THAT GIRL, THAT GIRL" },
      { start: 60.0, dur: 5.0, text: "THAT GIRL, THAT GIRL WOW, THAT GIRL" },
      { start: 65.5, dur: 5.0, text: "THAT GIRL, THAT GIRL THAT GIRL, THAT GIRL" },
      { start: 71.4, dur: 5.0, text: "WOW, THAT GIRL SHE’S THE BEST" },
      { start: 82.0, dur: 3.0, text: "SHAREHOUSE, HER HOUSEMATE’S HER BEST FRIEND" },
      { start: 85.3, dur: 3.5, text: "SOMETIMES THEY MIGHT SHARE HER BOYFRIEND" },
      { start: 89.2, dur: 6.0, text: "HELL YEAH MOOD BOARDS HER FUTURE IT LOOKS GOOD" },
      { start: 97.0, dur: 5.0, text: "SHE’S DONE LOOKING BACK, SHE’S ONLY LOOKING AHEAD" },
      { start: 105.0, dur: 4.0, text: "PRETTY, FUNNY, CAN FIGHT" },
      { start: 110.0, dur: 5.0, text: "SHE ALWAYS KNEW SHE HAD SOMETHING SPECIAL INSIDE" },
      { start: 117.0, dur: 7.0, text: "SHE TAKES DOWN AN INCEL ON THE INTERNET WHEN SHE NEEDS JUST A LITTLE UNWIND" },
      { start: 130.0, dur: 5.0, text: "THAT GIRL, THAT GIRL THAT GIRL, THAT GIRL" },
      { start: 136.0, dur: 13.0, text: "WOW, THAT GIRL SHE’S THE BEST" },
      { start: 164.0, dur: 5.0, text: "SHE’S THE BEST, HEARTBEAT BUMPING IN MY CHEST" }
    ];

    // Initialize local storage with default if empty
    if (!localStorage.getItem('karaoke_mFA1P8ZzoLw')) {
      localStorage.setItem('karaoke_mFA1P8ZzoLw', JSON.stringify(troyeSubs));
    }

    // YouTube API Setup
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: currentVideoId,
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1,
          'origin': window.location.origin || '*'
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
      renderHistoryList();
      loadFromStorageOrFetch(currentVideoId);
    }

    function extractVideoId(url) {
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function renderHistoryList() {
      historyChips.innerHTML = '';
      const keys = Object.keys(localStorage).filter(k => k.startsWith('karaoke_'));
      
      if (keys.length === 0) {
        historyChips.innerHTML = '<span style="color:#666;">אין סרטונים שמורים עדיין</span>';
        return;
      }

      keys.forEach(k => {
        const vId = k.replace('karaoke_', '');
        const btn = document.createElement('span');
        btn.className = 'history-chip';
        btn.textContent = `▶ ${vId}`;
        btn.onclick = () => {
          document.getElementById('ytUrlInput').value = `https://youtu.be/${vId}`;
          handleLoadVideo();
        };
        historyChips.appendChild(btn);
      });
    }

    function handleLoadVideo() {
      const url = document.getElementById('ytUrlInput').value.trim();
      const videoId = extractVideoId(url);
      if (!videoId) {
        statusMsg.textContent = "❌ קישור יוטיוב לא תקין.";
        return;
      }

      currentVideoId = videoId;
      if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
      }

      loadFromStorageOrFetch(videoId);
    }

    function loadFromStorageOrFetch(videoId) {
      const saved = localStorage.getItem(`karaoke_${videoId}`);
      if (saved) {
        try {
          const subs = JSON.parse(saved);
          buildDOMFromSubs(subs);
          statusMsg.textContent = "⚡ נטען אוטומטית מהזיכרון המקומי!";
          return;
        } catch(e) {}
      }

      statusMsg.textContent = "ℹ️ סרטון חדש: הדביקי את התמליל ולחצי 'שמור וסנכרן תמליל'.";
      buildDOMFromSubs([]);
    }

    function parseAndSaveTranscript() {
      const raw = document.getElementById('manualTranscriptInput').value.trim();
      if (!raw) return;

      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      const subs = [];
      let currentStart = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const timeMatch = line.match(/^(\d{1,2}:)?(\d{1,2}):(\d{2})$/);
        if (timeMatch) {
          const parts = line.split(':').map(Number);
          let sec = 0;
          if (parts.length === 3) sec = parts[0] * 3600 + parts[1] * 60 + parts[2];
          else sec = parts[0] * 60 + parts[1];
          currentStart = sec;
        } else if (currentStart !== null) {
          subs.push({ start: currentStart, dur: 2.8, text: line });
          currentStart = null;
        }
      }

      if (subs.length === 0) {
        lines.forEach(l => {
          const match = l.match(/\[?(\d{1,2}):(\d{2})\]?\s*(.*)/);
          if (match) {
            const sec = parseInt(match[1]) * 60 + parseInt(match[2]);
            if (match[3]) subs.push({ start: sec, dur: 2.8, text: match[3] });
          }
        });
      }

      if (subs.length > 0) {
        localStorage.setItem(`karaoke_${currentVideoId}`, JSON.stringify(subs));
        buildDOMFromSubs(subs);
        renderHistoryList();
        document.getElementById('manualTranscriptInput').value = '';
        statusMsg.textContent = `💾 נשמר בזיכרון! (${subs.length} שורות מסונכרנות)`;
      } else {
        statusMsg.textContent = "❌ לא זוהה פורמט תמליל תקין.";
      }
    }

    function buildDOMFromSubs(subs) {
      allWords = [];
      box.innerHTML = '<div id="bouncing-ball"></div>';
      activeWordIndex = -1;

      if (!subs || subs.length === 0) {
        box.innerHTML = '<div style="color: #666; text-align: center; margin-top: 100px;">אין מילים מסונכרנות לסרטון זה עדיין.</div>';
        return;
      }

      subs.forEach((sub, lineIdx) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'caption-line';
        lineDiv.id = `line-${lineIdx}`;

        const cleanText = sub.text.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
        const rawWords = cleanText.split(/\s+/);
        const lineStart = sub.start;
        const lineDuration = sub.dur || (rawWords.length * 0.4);
        const wordInterval = lineDuration / (rawWords.length || 1);

        rawWords.forEach((w, wIdx) => {
          if (!w) return;
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = w;
          lineDiv.appendChild(span);

          allWords.push({
            time: lineStart + (wIdx * wordInterval),
            element: span,
            lineElement: lineDiv
          });
        });

        box.appendChild(lineDiv);
      });
    }

    function onPlayerStateChange(event) {
      const ball = document.getElementById('bouncing-ball');
      if (event.data === YT.PlayerState.PLAYING) {
        if (ball) ball.style.display = 'block';
        if (!loopId) loopId = requestAnimationFrame(renderLoop);
      } else {
        cancelAnimationFrame(loopId);
        loopId = null;
      }
    }

    function renderLoop() {
      if (player && typeof player.getCurrentTime === 'function' && allWords.length > 0) {
        const currentTime = player.getCurrentTime();

        let idx = -1;
        for (let i = 0; i < allWords.length; i++) {
          if (currentTime >= allWords[i].time) {
            idx = i;
          } else {
            break;
          }
        }

        if (idx !== activeWordIndex && idx !== -1) {
          allWords.forEach((item, i) => {
            if (i < idx) item.element.className = 'word passed';
            else if (i === idx) item.element.className = 'word active';
            else item.element.className = 'word';
          });

          const activeEl = allWords[idx].element;
          const activeLine = allWords[idx].lineElement;
          const ball = document.getElementById('bouncing-ball');

          document.querySelectorAll('.caption-line').forEach(l => l.classList.remove('active-line'));
          activeLine.classList.add('active-line');

          const boxRect = box.getBoundingClientRect();
          const wordRect = activeEl.getBoundingClientRect();

          const left = (wordRect.left - boxRect.left) + (wordRect.width / 2) + box.scrollLeft;
          const top = (wordRect.top - boxRect.top) + box.scrollTop - 4;

          if (ball) {
            ball.style.left = `${left}px`;
            ball.style.top = `${top}px`;
          }

          activeLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          activeWordIndex = idx;
        }
      }
      loopId = requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
