<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קריוקי וידאו וכתוביות SRT מקומי</title>
  <style>
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --accent: #ff2a6d;
      --text: #e0e6ed;
      --text-dim: #71788e;
      --highlight: #ffe600;
      --sung-word: #05d9e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    /* Upload Panel */
    .controls-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .upload-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .file-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 220px;
    }
    label {
      font-size: 0.9rem;
      color: #b2b8c6;
    }
    input[type="file"] {
      background: #0f111a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      font-size: 13px;
      direction: ltr;
    }

    #status-msg {
      font-size: 0.85rem;
      color: var(--sung-word);
    }

    /* Video Player */
    .video-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      background: #000;
      display: flex;
      justify-content: center;
    }
    video {
      width: 100%;
      max-height: 420px;
      outline: none;
    }

    /* Lyrics Display */
    .lyrics-container {
      position: relative;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 16px;
      height: 340px;
      overflow-y: auto;
      scroll-behavior: smooth;
      direction: ltr;
      border: 1px solid rgba(255,255,255,0.07);
    }
    #bouncing-ball {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      pointer-events: none;
      transition: left 0.08s ease-out, top 0.08s ease-out;
      transform: translate(-50%, -100%);
      display: none;
      z-index: 10;
      animation: bounce 0.4s infinite alternate ease-in-out;
    }
    @keyframes bounce {
      0% { transform: translate(-50%, -120%); }
      100% { transform: translate(-50%, -180%); }
    }
    .caption-line {
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      font-size: 1.25rem;
      line-height: 1.7;
      transition: background 0.25s;
    }
    .caption-line.active-line {
      background: rgba(255, 42, 109, 0.12);
      border-left: 3px solid var(--accent);
    }
    .word {
      display: inline-block;
      position: relative;
      color: var(--text-dim);
      transition: color 0.15s, transform 0.15s;
    }
    .word.passed { color: var(--sung-word); }
    .word.active {
      color: var(--highlight);
      font-weight: 800;
      transform: scale(1.18);
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="controls-panel">
      <div class="upload-row">
        <div class="file-input-group">
          <label>📁 1. העלאת קובץ וידאו (MP4 / WebM / MOV):</label>
          <input type="file" id="videoFileInput" accept="video/*">
        </div>
        <div class="file-input-group">
          <label>📄 2. העלאת קובץ כתוביות (SRT / VTT):</label>
          <input type="file" id="srtFileInput" accept=".srt,.vtt">
        </div>
      </div>
      <div id="status-msg">אנא בחרי קובץ וידאו וקובץ כתוביות להפעלה.</div>
    </div>

    <div class="video-box">
      <video id="mainVideo" controls playsinline></video>
    </div>

    <div class="lyrics-container" id="lyricsBox">
      <div id="bouncing-ball"></div>
    </div>
  </div>

  <script>
    const videoEl = document.getElementById('mainVideo');
    const videoInput = document.getElementById('videoFileInput');
    const srtInput = document.getElementById('srtFileInput');
    const box = document.getElementById('lyricsBox');
    const ball = document.getElementById('bouncing-ball');
    const statusMsg = document.getElementById('status-msg');

    let allWords = [];
    let activeWordIndex = -1;
    let loopId = null;

    // Handle Local Video File
    videoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const fileUrl = URL.createObjectURL(file);
        videoEl.src = fileUrl;
        statusMsg.textContent = `🎬 הווידאו "${file.name}" נטען בהצלחה!`;
      }
    });

    // Handle Local SRT File
    srtInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const content = evt.target.result;
          parseAndLoadSRT(content);
          statusMsg.textContent = `📄 הכתוביות "${file.name}" נטענו וסונכרנו!`;
        };
        reader.readAsText(file);
      }
    });

    // Parse SRT format
    function parseAndLoadSRT(data) {
      const normalized = data.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const blocks = normalized.split('\n\n');
      const subs = [];

      blocks.forEach(block => {
        const lines = block.trim().split('\n');
        if (lines.length >= 2) {
          // Find time line (e.g. 00:01:20,000 --> 00:01:23,500)
          const timeLineIdx = lines[0].includes('-->') ? 0 : (lines[1] && lines[1].includes('-->') ? 1 : -1);
          if (timeLineIdx !== -1) {
            const timeParts = lines[timeLineIdx].split('-->');
            const startSec = timeStringToSeconds(timeParts[0].trim());
            const endSec = timeStringToSeconds(timeParts[1].trim());
            const text = lines.slice(timeLineIdx + 1).join(' ').trim();

            if (text) {
              subs.push({
                start: startSec,
                dur: Math.max(0.8, endSec - startSec),
                text: text
              });
            }
          }
        }
      });

      buildDOMFromSubs(subs);
    }

    function timeStringToSeconds(str) {
      str = str.replace(',', '.');
      const parts = str.split(':');
      let sec = 0;
      if (parts.length === 3) {
        sec = parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
      } else if (parts.length === 2) {
        sec = parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
      }
      return sec;
    }

    function buildDOMFromSubs(subs) {
      allWords = [];
      box.innerHTML = '<div id="bouncing-ball"></div>';
      activeWordIndex = -1;

      subs.forEach((sub, lineIdx) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'caption-line';
        lineDiv.id = `line-${lineIdx}`;

        // Clean HTML tags if present (e.g. <i>, <font>)
        const cleanText = sub.text.replace(/<[^>]*>/g, '').trim();
        const rawWords = cleanText.split(/\s+/);
        const lineStart = sub.start;
        const lineDuration = sub.dur;
        const wordInterval = lineDuration / (rawWords.length || 1);

        rawWords.forEach((w, wIdx) => {
          if (!w) return;
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = w;
          lineDiv.appendChild(span);

          allWords.push({
            time: lineStart + (wIdx * wordInterval),
            element: span,
            lineElement: lineDiv
          });
        });

        box.appendChild(lineDiv);
      });
    }

    // Sync Loop using requestAnimationFrame
    videoEl.addEventListener('play', () => {
      const b = document.getElementById('bouncing-ball');
      if (b) b.style.display = 'block';
      if (!loopId) loopId = requestAnimationFrame(renderLoop);
    });

    videoEl.addEventListener('pause', () => {
      cancelAnimationFrame(loopId);
      loopId = null;
    });

    videoEl.addEventListener('seeked', () => {
      activeWordIndex = -1;
    });

    function renderLoop() {
      if (!videoEl.paused && allWords.length > 0) {
        const currentTime = videoEl.currentTime;

        let idx = -1;
        for (let i = 0; i < allWords.length; i++) {
          if (currentTime >= allWords[i].time) {
            idx = i;
          } else {
            break;
          }
        }

        if (idx !== activeWordIndex && idx !== -1) {
          allWords.forEach((item, i) => {
            if (i < idx) item.element.className = 'word passed';
            else if (i === idx) item.element.className = 'word active';
            else item.element.className = 'word';
          });

          const activeEl = allWords[idx].element;
          const activeLine = allWords[idx].lineElement;
          const ballEl = document.getElementById('bouncing-ball');

          document.querySelectorAll('.caption-line').forEach(l => l.classList.remove('active-line'));
          activeLine.classList.add('active-line');

          const boxRect = box.getBoundingClientRect();
          const wordRect = activeEl.getBoundingClientRect();

          const left = (wordRect.left - boxRect.left) + (wordRect.width / 2) + box.scrollLeft;
          const top = (wordRect.top - boxRect.top) + box.scrollTop - 4;

          if (ballEl) {
            ballEl.style.left = `${left}px`;
            ballEl.style.top = `${top}px`;
          }

          activeLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          activeWordIndex = idx;
        }
      }
      loopId = requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
