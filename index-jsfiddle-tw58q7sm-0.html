<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Troye Sivan - She's the Best | קריוקי מילה במילה</title>

  <style>
    
    :root {
      --bg: #0f111a;
      --card-bg: #1a1d2e;
      --accent: #ff2a6d;
      --text: #e0e6ed;
      --text-dim: #71788e;
      --highlight: #ffe600;
      --sung-word: #05d9e8;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .video-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      background: #000;
    }
    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .lyrics-container {
      position: relative;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 24px 20px;
      height: 360px;
      overflow-y: auto;
      scroll-behavior: smooth;
      direction: ltr;
      border: 1px solid rgba(255,255,255,0.07);
    }
    /* Dynamic bouncing ball */
    #bouncing-ball {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      pointer-events: none;
      transition: left 0.12s ease-out, top 0.12s ease-out;
      transform: translate(-50%, -100%);
      display: none;
      z-index: 10;
      animation: bounce 0.4s infinite alternate ease-in-out;
    }
    @keyframes bounce {
      0% { transform: translate(-50%, -120%); }
      100% { transform: translate(-50%, -180%); }
    }
    .verse-block {
      padding: 14px 16px;
      margin: 12px 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      transition: background 0.3s;
    }
    .verse-block.current-verse {
      background: rgba(255, 42, 109, 0.08);
      border-left: 3px solid var(--accent);
    }
    .words-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      font-size: 1.25rem;
      line-height: 1.8;
      font-weight: 500;
    }
    .word {
      display: inline-block;
      position: relative;
      color: var(--text-dim);
      transition: color 0.15s, transform 0.15s;
    }
    .word.passed {
      color: var(--sung-word);
    }
    .word.active {
      color: var(--highlight);
      font-weight: 800;
      transform: scale(1.15);
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
    }
    .he-trans {
      margin-top: 6px;
      font-size: 0.95rem;
      color: #9299a9;
      direction: rtl;
      text-align: right;
      font-weight: normal;
    }
    .verse-block.current-verse .he-trans {
      color: #ffffff;
    }
  
  </style>

  
</head>

        words: [

        ]
      },
      {

        words: [
          { text: "[MUSIC", t: 250.0 }, { text: "ENDS]", t: 251.5 }
        ]
      }
    ];

    // Flatten all words with references
    const allWords = [];
    const box = document.getElementById('lyricsBox');
    const ball = document.getElementById('bouncing-ball');

    songData.forEach((verse, vIdx) => {
      const vDiv = document.createElement('div');
      vDiv.className = 'verse-block';
      vDiv.id = `verse-${vIdx}`;

      const row = document.createElement('div');
      row.className = 'words-row';

      verse.words.forEach((w, wIdx) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.id = `w-${vIdx}-${wIdx}`;
        span.textContent = w.text;
        row.appendChild(span);

        allWords.push({
          time: w.t,
          element: span,
          verseElement: vDiv
        });
      });

      vDiv.appendChild(row);

      const heDiv = document.createElement('div');
      heDiv.className = 'he-trans';
      heDiv.textContent = verse.he;
      vDiv.appendChild(heDiv);

      box.appendChild(vDiv);
    });

    // YouTube API Setup
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'mFA1P8ZzoLw',
        playerVars: {
          'playsinline': 1,
          'rel': 0,
          'modestbranding': 1,
          'origin': window.location.origin || '*'
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    let loopId = null;
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        ball.style.display = 'block';
        if (!loopId) loopId = requestAnimationFrame(renderLoop);
      } else {
        cancelAnimationFrame(loopId);
        loopId = null;
      }
    }

    let activeWordIndex = -1;
    function renderLoop() {
      if (player && typeof player.getCurrentTime === 'function') {
        const currentTime = player.getCurrentTime();

        let idx = -1;
        for (let i = 0; i < allWords.length; i++) {
          if (currentTime >= allWords[i].time) {
            idx = i;
          } else {
            break;
          }
        }

        if (idx !== activeWordIndex && idx !== -1) {
          // Update passed & active styles
          allWords.forEach((item, i) => {
            if (i < idx) {
              item.element.className = 'word passed';
            } else if (i === idx) {
              item.element.className = 'word active';
            } else {
              item.element.className = 'word';
            }
          });

          // Position Ball over active word
          const activeEl = allWords[idx].element;
          const activeVerse = allWords[idx].verseElement;

          // Highlight current block
          document.querySelectorAll('.verse-block').forEach(vb => vb.classList.remove('current-verse'));
          activeVerse.classList.add('current-verse');

          // Position calculations relative to scroll container
          const boxRect = box.getBoundingClientRect();
          const wordRect = activeEl.getBoundingClientRect();

          const left = (wordRect.left - boxRect.left) + (wordRect.width / 2) + box.scrollLeft;
          const top = (wordRect.top - boxRect.top) + box.scrollTop - 4;

          ball.style.left = `${left}px`;
          ball.style.top = `${top}px`;

          // Auto-scroll block into view smoothly
          activeVerse.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

          activeWordIndex = idx;
        }
      }
      loopId = requestAnimationFrame(renderLoop);
    }
  
  </script>

</html>
